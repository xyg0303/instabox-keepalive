name: InstaBox Keepalive

on:
  schedule:
    - cron: '*/10 * * * *' # 每 10 分钟自动跑一次
  workflow_dispatch: # 允许你手动点按钮测试

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run original tick script
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        # 进入 scripts 目录，执行原版脚本，--now 代表立刻巡检
        run: |
          cd scripts
          python instabox_tick.py github --now
