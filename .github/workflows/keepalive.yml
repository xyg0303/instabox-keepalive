name: InstaBox Keepalive

on:
  # schedule:
  #   - cron: '*/10 * * * *' # 注释，不再用github内置定时做主力
  workflow_dispatch: # 手动按钮触发，应急
  repository_dispatch: # 外部API（Crontap）触发
    types: [instabox-keepalive-run]

permissions:
  contents: read
  actions: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run original tick script
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          cd scripts
          python instabox_tick.py github --now
