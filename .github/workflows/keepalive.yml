name: InstaBox Keepalive

on:
  # 【备用兜底】GitHub内置定时，不做主力，外部失效时保底
  schedule:
    - cron: '*/10 * * * *'
  # 【手动应急】页面点按钮直接触发，调试/紧急唤醒用
  workflow_dispatch:
  # 【主力触发】外部定时服务通过API调用，稳定不丢任务
  repository_dispatch:
    types: [instabox-keepalive-run]

permissions:
  contents: read
  actions: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run tick script
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          cd scripts
          python instabox_tick.py github --now
